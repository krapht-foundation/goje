<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#141c29">
  <title>{{.}}</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #141c29; color: #fff; }
    main {
      box-sizing: border-box; height: 100%; touch-action: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #goje { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #status { position: fixed; top: 1rem; left: 1rem; right: 1rem; margin: 0; font: 1rem system-ui; }
  </style>
</head>
<body>
  <main><canvas id="goje" tabindex="0" aria-label="{{.}}"></canvas></main>
  <p id="status" role="status">Loading {{.}}…</p>
  <script src="wasm_exec.js"></script>
  <script>
    /** @file Start the game once and report what keeps it from running. */
    const statusLine = document.querySelector("#status");

    /** @returns {Promise<void>} Resolves when the game exits. */
    async function start() {
      if (typeof WebAssembly !== "object") throw new Error("This browser does not support WebAssembly.");
      if (!document.createElement("canvas").getContext("webgl2")) {
        throw new Error("This browser or device does not support WebGL 2.");
      }
      const go = new Go();
      let exitCode = 0;
      /** @param {number} code - Go program exit status. */
      go.exit = code => { exitCode = code; };
      const response = await fetch("game.wasm");
      if (!response.ok) throw new Error(`The game failed to download: HTTP ${response.status}.`);
      const { instance } = await WebAssembly.instantiateStreaming(response, go.importObject);
      statusLine.hidden = true;
      document.querySelector("#goje").focus();
      await go.run(instance);
      if (exitCode !== 0) throw new Error("The game stopped with an error. Check the browser console.");
      statusLine.hidden = false;
      statusLine.textContent = "The game stopped.";
    }
    start().catch(error => {
      statusLine.hidden = false;
      statusLine.textContent = error.message;
      console.error(error);
    });
  </script>
</body>
</html>
