name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Ensure native graphics dependencies
        run: |
          # Install only the X11 headers GLFW uses, not the xorg-dev bundle.
          packages=(xvfb xauth libgl1-mesa-dri libgl-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev)
          missing=()
          for package in "${packages[@]}"; do
            if [[ "$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null)" != installed ]]; then
              missing+=("$package")
            fi
          done
          if ((${#missing[@]})); then
            # Refresh package indexes only if the runner's indexes are stale.
            if ! sudo apt-get install -y --no-install-recommends "${missing[@]}"; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends "${missing[@]}"
            fi
          fi
      - name: Run Go checks
        run: make check test-race vuln check-example
      - name: Run simulation tests as WebAssembly
        run: make test-wasm
      - name: Run desktop smoke
        run: xvfb-run -a make smoke-desktop
      - name: Cache the pinned Chromium build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Set up Chromium
        run: |
          make setup-web
          # The hosted image usually has Chromium's runtime libraries. Use
          # Playwright's installer if the image is missing a linked library.
          shopt -s nullglob
          browsers=(.build/playwright/chromium_headless_shell-*/chrome-headless-shell-linux*/chrome-headless-shell)
          if ((${#browsers[@]} != 1)); then
            echo "Expected one Chromium headless shell after setup" >&2
            exit 1
          fi
          dependencies=$(ldd "${browsers[0]}")
          if grep -q 'not found' <<< "$dependencies"; then
            npm exec -- playwright install-deps chromium
          fi
      - name: Run browser playground smoke
        run: make smoke-web
      - name: Run Pixel Art Maker smoke
        run: make smoke-pixel-art
      - name: Run Sound Maker smoke
        run: make smoke-sound-maker
      - name: Play the Pixel Art Maker and Sprite Clip Editor exports on desktop and web
        run: xvfb-run -a make smoke-sprite-roundtrip
      - name: Play both browser exports on desktop and web
        run: xvfb-run -a make smoke-level-roundtrip
      - name: Play Level Builder zones on desktop and web
        run: xvfb-run -a make smoke-zone-roundtrip
      - name: Verify Level Builder placement editing
        run: make smoke-placement-editor
      - name: Play the outpost authored in the Level Builder on desktop and web
        run: xvfb-run -a make smoke-outpost-roundtrip
      - name: Play the independent 2D game on desktop and web
        run: xvfb-run -a make smoke-beacon
      - name: Verify Beacon audio on desktop and in Chromium
        run: xvfb-run -a make smoke-beacon-audio
      - name: Play the Sound Maker export on desktop and web
        run: xvfb-run -a make smoke-sound-roundtrip
      - name: Drive touch and gamepad input in Chromium
        run: make smoke-input
      - name: Compare the Go mixer with the Web Audio graph
        run: make smoke-mixer
      - name: Check the relay against Chromium's WebSocket
        run: make smoke-ws
      - name: Play the online outpost between a native host and Chromium
        run: make smoke-online
      - name: Build and package Beacon with goje
        run: xvfb-run -a make smoke-goje-build
      - name: Edit a glyph in the Font Editor and render the export
        run: xvfb-run -a make smoke-font-editor
      - name: Author the versus level in the Level Builder
        run: xvfb-run -a make smoke-versus-editor

  # Provisional, as RFC 0018 records: if this job cannot pass, the Windows
  # target is reverted and documented as unsupported.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: 1
      MESA_VERSION: 26.3.1
      MESA_SHA256: 64e84cf13d67dd354640bf443ed0445e6a83afd06a5729f0750b3744d633b3f1
    steps:
      # Pinned traces and golden files are compared byte for byte.
      - name: Keep checked-out line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Check the C compiler for cgo
        run: gcc --version
      - name: Vet the desktop host and build tools
        run: go vet ./platform/ ./internal/platform/... ./cmd/goje/ ./update/ ./examples/beacon/
      - name: Test the build, package, signing, and desktop host logic
        run: go test ./cmd/goje/ ./update/ ./internal/platform/...
      - name: Install Mesa's software OpenGL for the windowless runner
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o mesa.7z \
            "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_VERSION/mesa3d-$MESA_VERSION-release-msvc.7z"
          echo "$MESA_SHA256  mesa.7z" | sha256sum -c
          7z x -omesa mesa.7z > /dev/null
          echo "MESA_DIR=$PWD/mesa/x64" >> "$GITHUB_ENV"
      - name: Build, package, and run Beacon with goje
        env:
          GALLIUM_DRIVER: llvmpipe
        run: bash scripts/smoke-goje-windows.sh
