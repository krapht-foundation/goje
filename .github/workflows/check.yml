name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install native graphics build and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libgl1-mesa-dev xorg-dev
      - name: Run Go checks
        run: make check test-race vuln check-example
      - name: Run desktop smoke
        run: xvfb-run -a make smoke-desktop
      - name: Install Chromium
        run: make setup-web PLAYWRIGHT_INSTALL_FLAGS=--with-deps
      - name: Run browser smoke
        run: make smoke-web
