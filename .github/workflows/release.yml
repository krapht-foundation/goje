name: Release

on:
  workflow_dispatch:
    inputs:
      stage_version:
        description: >-
          To sign and publish Beacon on the staging channel, run on tag beacon-staging-vVERSION and enter VERSION.
          Leave empty to only build.
        required: false
        default: ''
      previous_version:
        description: An earlier staged version that must still verify after publishing.
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Ensure native graphics dependencies
        if: runner.os == 'Linux'
        run: |
          # Install only the X11 headers GLFW uses, not the xorg-dev bundle.
          packages=(xvfb xauth libgl1-mesa-dri libgl-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev)
          missing=()
          for package in "${packages[@]}"; do
            if [[ "$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null)" != installed ]]; then
              missing+=("$package")
            fi
          done
          if ((${#missing[@]})); then
            # Refresh package indexes only if the runner's indexes are stale.
            if ! sudo apt-get install -y --no-install-recommends "${missing[@]}"; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends "${missing[@]}"
            fi
          fi
      - name: Build and package the playground and Beacon
        run: |
          # Branches build development packages. Release and staging tags supply their own version.
          version=0.0.0-dev
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            case "$GITHUB_REF_NAME" in
              beacon-staging-v*) version=${GITHUB_REF_NAME#beacon-staging-v} ;;
              v*) version=${GITHUB_REF_NAME#v} ;;
            esac
          fi
          mkdir -p .build
          goje=.build/goje$(go env GOEXE)
          go build -o "$goje" ./cmd/goje
          for game in playground:./cmd/playground beacon:./examples/beacon; do
            name=goje-${game%%:*}
            "$goje" package -o "dist/$name" -name "$name" -version "$version" \
              -id "io.github.krapht-foundation.$name" "${game#*:}"
          done
          # Each package writes its own checksums; the release job writes one combined file.
          mkdir -p dist/release
          if [[ $RUNNER_OS == Windows ]]; then
            # Windows records no execute bits, so its web archives differ from the
            # Unix ones in game.wasm's mode; only its desktop archives are released.
            cp dist/goje-*/release/goje-*-windows-* dist/release/
          else
            cp dist/goje-*/release/goje-* dist/release/
          fi
          ls -l dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error

  release:
    # Only a tag push drafts the release; a manual run on a tag must not draft it twice.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both runners build each web archive from the same sources, and Go's
          # WebAssembly output does not depend on the host, so the copies must match.
          for web in artifacts/release-ubuntu-24.04/*-web.zip; do
            cmp "$web" "artifacts/release-macos-latest/${web##*/}"
          done
          mkdir dist
          cp artifacts/release-*/* dist/
          cd dist
          sha256sum -- * | LC_ALL=C sort -k 2 > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Goje $GITHUB_REF_NAME" --generate-notes -- *

  # Signs and publishes Beacon on the staging channel (specs/update-m18.md). It runs
  # only when a maintainer starts the workflow by hand on a tag and enters that tag's
  # version, and only after the beacon-staging environment's reviewers approve it.
  stage:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'beacon-staging-v') && inputs.stage_version != ''
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: beacon-staging
    concurrency:
      group: beacon-staging
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
      - name: Sign the Beacon staging manifest
        env:
          STAGE_VERSION: ${{ inputs.stage_version }}
          SIGNING_KEY: ${{ secrets.BEACON_STAGING_KEY }}
          PUBLIC_KEY: ${{ vars.BEACON_STAGING_PUB }}
        run: |
          if [[ "$STAGE_VERSION" != "${GITHUB_REF_NAME#beacon-staging-v}" ]]; then
            echo "stage_version $STAGE_VERSION does not match the tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ -z "$SIGNING_KEY" || -z "$PUBLIC_KEY" ]]; then
            echo "BEACON_STAGING_KEY and BEACON_STAGING_PUB must both be configured" >&2
            exit 1
          fi
          go build -o .build/goje ./cmd/goje
          name=goje-beacon-$STAGE_VERSION
          # The Unix web archives must match; the Ubuntu copy is the canonical one.
          cmp "artifacts/release-ubuntu-24.04/$name-web.zip" "artifacts/release-macos-latest/$name-web.zip"
          mkdir stage
          cp "artifacts/release-ubuntu-24.04/$name-web.zip" "artifacts/release-ubuntu-24.04/$name-linux-amd64.tar.gz" \
            "artifacts/release-macos-latest/$name-darwin-arm64.tar.gz" \
            "artifacts/release-windows-latest/$name-windows-amd64.zip" stage/
          key=$RUNNER_TEMP/beacon-staging.key
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/beacon-staging.pub"
          # Fails unless the key matches the configured public half and the archives
          # are exactly the web archive and the three desktop archives of this version.
          .build/goje manifest -name goje-beacon -version "$STAGE_VERSION" -sign "$key" \
            -pub "$RUNNER_TEMP/beacon-staging.pub" -platforms darwin-arm64,linux-amd64,windows-amd64 \
            -o stage/update.json stage/goje-beacon-*
          (cd stage && sha256sum -- goje-beacon-* > SHA256SUMS && cat SHA256SUMS update.json)
      - name: Publish the version, then point the channel at it
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_VERSION: ${{ inputs.stage_version }}
        run: |
          # An immutable release cannot hold a moving manifest. Advance the
          # channel branch only after the versioned release and assets are live.
          repo="repos/$GITHUB_REPOSITORY"
          branch=beacon-staging-channel
          sha=$(gh api "$repo/git/trees/$branch" --jq '.tree[] | select(.path == "update.json") | .sha')
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --title "Beacon staging $STAGE_VERSION" \
            --notes "Beacon $STAGE_VERSION on the staging update channel." -- stage/*
          args=()
          if [[ -n $sha ]]; then
            args+=(-f "sha=$sha")
          fi
          gh api --method PUT "$repo/contents/update.json" -f "branch=$branch" \
            -f "message=Publish Beacon staging $STAGE_VERSION" \
            -f "content=$(base64 -w0 stage/update.json)" "${args[@]}" --jq .commit.sha

  # Checks the published channel over HTTPS with no access to the signing key.
  verify-stage:
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Verify the staging channel
        env:
          PUBLIC_KEY: ${{ vars.BEACON_STAGING_PUB }}
          STAGE_VERSION: ${{ inputs.stage_version }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
          REPO: ${{ github.repository }}
        run: |
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/beacon-staging.pub"
          scripts/smoke-update.sh "$RUNNER_TEMP/beacon-staging.pub" "$STAGE_VERSION" ${PREVIOUS_VERSION:+"$PREVIOUS_VERSION"}
