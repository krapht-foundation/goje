name: Mobile

# Generates Beacon's Capacitor wrappers with `goje mobile` and runs the gates in
# specs/mobile-m18.md. Nothing here uploads to a store.
on:
  push:
    branches: [main]
    paths: &mobile-paths
      - cmd/goje/**
      - examples/beacon/**
      - scripts/mobile-*.sh
      - scripts/smoke-mobile.mjs
      - .github/workflows/mobile.yml
  pull_request:
    branches: [main]
    paths: *mobile-paths
  workflow_dispatch:
    inputs:
      ios-archive:
        description: Archive and export a distribution-signed IPA with the mobile-release environment's credentials
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the smoke's pinned Node packages
        run: npm ci --ignore-scripts
      - name: Generate, sign, and verify the Android bundle
        run: scripts/mobile-android.sh build
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play the APK derived from the bundle offline by touch
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: scripts/mobile-android.sh emulator
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-android
          path: |
            .build/mobile-android/emulator.png
            .build/mobile-android/beacon/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install the smoke's pinned Node packages
        run: npm ci --ignore-scripts
      - name: Build for the simulator and play by touch
        run: scripts/mobile-ios.sh simulator
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-ios-simulator
          path: .build/mobile-ios/simulator.png
          if-no-files-found: ignore

  ios-archive:
    # Only a manual run asks for store credentials, and the protected environment's
    # reviewers decide whether it gets them.
    if: github.event_name == 'workflow_dispatch' && inputs.ios-archive
    runs-on: macos-26
    timeout-minutes: 45
    environment: mobile-release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Archive, export, and verify a distribution-signed IPA
        env:
          IOS_APP_ID: ${{ vars.IOS_APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          credentials=$(mktemp -d)
          trap 'rm -rf "$credentials"' EXIT
          export IOS_CERTIFICATE_P12=$credentials/distribution.p12 IOS_PROFILE=$credentials/store.mobileprovision
          base64 --decode <<< "$IOS_CERTIFICATE_P12_BASE64" > "$IOS_CERTIFICATE_P12"
          base64 --decode <<< "$IOS_PROFILE_BASE64" > "$IOS_PROFILE"
          scripts/mobile-ios.sh archive
