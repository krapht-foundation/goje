name: Bug report
description: Report an observable problem with Goje or its tools.
body:
  - type: markdown
    attributes:
      value: Do not include security vulnerabilities or private project data. Use the private channel in the [security policy](https://github.com/krapht-foundation/goje/blob/main/SECURITY.md).
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest project or fixture that reproduces the problem, if it can be shared publicly.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe what you expected and what happened. Include relevant redacted errors or screenshots.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the Goje revision, Go version, and desktop OS or browser version as applicable.
    validations:
      required: true
