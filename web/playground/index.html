<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goje Playground</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #141c29; color: #fff; }
    #goje { display: block; width: 100%; height: 100%; }
    #controls { position: fixed; right: 1rem; bottom: 1rem; margin: 0; font: 0.875rem system-ui; pointer-events: none; }
    #status { position: fixed; z-index: 1; top: 1rem; left: 1rem; font: 1rem system-ui; }
  </style>
</head>
<body>
  <p id="status" role="status">Loading Goje Playground…</p>
  <canvas id="goje" tabindex="0" aria-label="Goje Playground" aria-describedby="controls"></canvas>
  <p id="controls">Left click to select · Right click to move · Arrows to pan · W/S to zoom · R to reset</p>
  <script src="wasm_exec.js"></script>
  <script>
    /** @file Load the compiled Go playground and show startup or runtime failures. */

    const statusLine = document.querySelector("#status");
    /**
     * Fetch and instantiate the playground with the Go WebAssembly runtime.
     * @returns {Promise<void>} A promise kept pending while the playground runs.
     * @throws {Error} The returned promise rejects if startup fails or the runtime exits.
     */
    async function start() {
      const go = new Go();
      const query = new URLSearchParams(window.location.search);
      const diagnosticRun = query.get("diagnostics") === "1";
      const benchmark = query.get("bench");
      const requestedFixture = query.get("fixture");
      const fixture = ["courtyard", "ground", "sprite"].includes(requestedFixture) ? requestedFixture : "pickup";
      const controls = document.querySelector("#controls");
      if (query.get("fixture") === "pickup" || ((benchmark === "off" || benchmark === "on") && fixture === "pickup")) {
        go.env.GOJE_PLAYGROUND = "pickup";
        controls.textContent = "Arrows or WASD to move · R to reset";
      } else if (query.get("fixture") === "courtyard") {
        go.env.GOJE_PLAYGROUND = "courtyard";
        controls.textContent = "Click to select · Arrows to pan · W/S to zoom · Space to patrol · R to reset";
      } else if (query.get("fixture") === "yard") {
        go.env.GOJE_PLAYGROUND = "yard";
        controls.textContent = "Arrows or WASD to walk · R to reset";
      } else if (query.get("fixture") === "skirmish") {
        go.env.GOJE_PLAYGROUND = "skirmish";
        controls.textContent = "Click to select · Right click to move · Arrows to pan · W/S to zoom · R to reset";
      } else if (query.get("fixture") === "outpost") {
        go.env.GOJE_PLAYGROUND = "outpost";
        controls.textContent = "Drag to select · Right click to order · Esc for the menu";
      }
      if (diagnosticRun) go.env.GOJE_DIAGNOSTICS = "1";
      if (benchmark === "off" || benchmark === "on") {
        go.env.GOJE_BENCH_MODE = benchmark;
        go.env.GOJE_BENCH_FIXTURE = fixture;
        const dense = fixture === "ground" ? "16384" : "2048";
        go.env.GOJE_BENCH_SPRITES = query.get("sprites") === dense ? dense : "0";
      }
      let exitCode = 0;
      /** @param {number} code - Exit status from the Go program. */
      go.exit = code => { exitCode = code; };
      const response = await fetch("playground.wasm");
      if (!response.ok) throw new Error(`Wasm download failed: HTTP ${response.status}`);
      const { instance } = await WebAssembly.instantiateStreaming(response, go.importObject);
      statusLine.hidden = true;
      await go.run(instance);
      if (exitCode !== 0) {
        throw new Error("The playground stopped with an error. Check the browser console for details.");
      }
      statusLine.hidden = false;
      statusLine.textContent = diagnosticRun ? "Diagnostics finished. See the browser console." : "The playground stopped.";
    }
    start().catch(error => {
      statusLine.hidden = false;
      statusLine.textContent = error.message;
      console.error(error);
    });
  </script>
</body>
</html>
