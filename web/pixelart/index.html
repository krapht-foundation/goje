<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goje Pixel Art Maker</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <main>
    <h1>Goje Pixel Art Maker</h1>
    <p>Paint a transparent sprite sheet and download it as a PNG. Files stay in this browser.</p>
    <fieldset id="sheet" disabled>
      <legend>Sheet</legend>
      <label>Width <input id="width" type="number" min="1" max="512" step="1" value="48" required></label>
      <label>Height <input id="height" type="number" min="1" max="512" step="1" value="32" required></label>
      <button id="new" type="button">New sheet</button>
      <button id="open" type="button">Open PNG</button>
      <input id="file" type="file" accept=".png,image/png" hidden>
      <button id="export" type="button" disabled>Download PNG</button>
    </fieldset>
    <fieldset id="tools" disabled>
      <legend>Tools</legend>
      <button id="undo" type="button" disabled>Undo</button>
      <button id="redo" type="button" disabled>Redo</button>
      <button id="pencil" type="button" aria-pressed="true">Pencil</button>
      <button id="eraser" type="button" aria-pressed="false">Eraser</button>
      <label>Color <input id="color" type="color" value="#386bb0"></label>
      <div id="palette" role="group" aria-label="Palette">
        <button type="button" data-color="#000000" aria-label="Black" title="Black" aria-pressed="false" style="--swatch: #000000"></button>
        <button type="button" data-color="#ffffff" aria-label="White" title="White" aria-pressed="false" style="--swatch: #ffffff"></button>
        <button type="button" data-color="#7f7f7f" aria-label="Gray" title="Gray" aria-pressed="false" style="--swatch: #7f7f7f"></button>
        <button type="button" data-color="#d83a3a" aria-label="Red" title="Red" aria-pressed="false" style="--swatch: #d83a3a"></button>
        <button type="button" data-color="#f08a24" aria-label="Orange" title="Orange" aria-pressed="false" style="--swatch: #f08a24"></button>
        <button type="button" data-color="#f4d03f" aria-label="Yellow" title="Yellow" aria-pressed="false" style="--swatch: #f4d03f"></button>
        <button type="button" data-color="#3fa34d" aria-label="Green" title="Green" aria-pressed="false" style="--swatch: #3fa34d"></button>
        <button type="button" data-color="#386bb0" aria-label="Blue" title="Blue" aria-pressed="true" style="--swatch: #386bb0"></button>
        <button type="button" data-color="#7d4bb3" aria-label="Purple" title="Purple" aria-pressed="false" style="--swatch: #7d4bb3"></button>
        <button type="button" data-color="#8b5a2b" aria-label="Brown" title="Brown" aria-pressed="false" style="--swatch: #8b5a2b"></button>
      </div>
      <label>Zoom
        <select id="zoom">
          <option value="1">1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
          <option value="16" selected>16×</option>
          <option value="32">32×</option>
        </select>
      </label>
    </fieldset>
    <p id="status" role="status">Loading the Pixel Art Maker…</p>
    <p id="keys">Focus the grid, use arrow keys to move, then Enter or Space to edit a pixel. Escape cancels a drag.</p>
    <p><output id="coordinate" aria-label="Active pixel"></output> · <output id="dirty">No sheet open</output></p>
    <div class="viewport">
      <div id="grid" role="group" aria-label="Sprite sheet editing grid" aria-describedby="keys coordinate" hidden>
        <canvas id="art" width="1" height="1" aria-hidden="true"></canvas>
        <div id="lines" aria-hidden="true"></div>
        <div id="cursor" aria-hidden="true"></div>
      </div>
    </div>
    <figure id="preview" hidden>
      <figcaption>Sheet at 1×</figcaption>
      <canvas id="native" width="1" height="1" aria-label="Sheet at native size"></canvas>
    </figure>
  </main>
  <script src="wasm_exec.js"></script>
  <script type="module" src="editor.mjs"></script>
</body>
</html>
