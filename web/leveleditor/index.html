<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goje Level Editor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="toolbar">
    <h1>Goje Level Editor</h1>
    <div class="group">
      <label for="open" class="button">Open level</label>
      <input id="open" type="file" accept=".json,application/json" disabled>
    </div>
    <div class="group" role="group" aria-label="Tools">
      <button id="floor" type="button" aria-pressed="true" disabled>Floor</button>
      <button id="wall" type="button" aria-pressed="false" disabled>Wall</button>
      <button id="placement" type="button" aria-pressed="false" disabled>Move placement</button>
    </div>
    <div class="group" role="group" aria-label="History">
      <button id="undo" type="button" aria-keyshortcuts="Control+Z Meta+Z" disabled>Undo</button>
      <button id="redo" type="button" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z" disabled>Redo</button>
    </div>
    <div class="group">
      <button id="export" type="button" disabled>Export</button>
    </div>
  </header>
  <p id="status" role="status">Loading editor…</p>
  <p id="cursor" aria-live="polite">No level open.</p>
  <div id="scroller" class="scroller">
    <canvas id="board" tabindex="0" role="application" aria-label="Level grid" aria-describedby="cursor help" hidden></canvas>
  </div>
  <p id="help">Arrows move the cell cursor. Space or Enter applies the tool; with Move placement, choose a placement and then its target. Escape cancels. Ctrl or ⌘ + Z undoes; add Shift to redo.</p>
  <script src="wasm_exec.js"></script>
  <script type="module" src="editor.mjs"></script>
</body>
</html>
